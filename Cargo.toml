[package]
name = "quant-b3"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
# kairos/: a linguagem Kairós (compilador, runtime e motor de IA)
members = ["kairos"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
bincode = "1.3"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
libm = "0.2"
native-tls = { version = "0.2.18", optional = true }
ureq = { version = "2.12", default-features = false, features = ["native-tls"], optional = true }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }

[features]
# downloads (B3, BCB, NEFIN) over HTTPS with the native TLS of each system; the Kairós language
# uses this crate without it, so it stays pure Rust and builds on any system Rust supports
default = ["net"]
net = ["dep:ureq", "dep:native-tls"]
