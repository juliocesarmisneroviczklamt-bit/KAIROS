[package]
name = "quant-b3"
version = "0.1.0"
edition = "2024"

[workspace]
# kairos/: a linguagem Kairós (compilador, runtime e motor de IA)
members = ["kairos"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
bincode = "1.3"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
native-tls = "0.2.18"
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }
