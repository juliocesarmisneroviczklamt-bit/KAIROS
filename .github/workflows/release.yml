# Builds Kairós for every major system and publishes the GitHub release of a `v*` tag.
# Running it by hand (workflow_dispatch) builds everything but publishes nothing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # experimental targets never block a release
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static (musl) where Rust supports it, so one binary runs on any distribution
          - { name: linux-x86_64,      os: ubuntu-latest,  target: x86_64-unknown-linux-musl,      tool: cross }
          - { name: linux-i686,        os: ubuntu-latest,  target: i686-unknown-linux-musl,        tool: cross }
          - { name: linux-aarch64,     os: ubuntu-latest,  target: aarch64-unknown-linux-musl,     tool: cross }
          - { name: linux-armv7,       os: ubuntu-latest,  target: armv7-unknown-linux-musleabihf, tool: cross }
          - { name: linux-armv6,       os: ubuntu-latest,  target: arm-unknown-linux-musleabihf,   tool: cross }
          - { name: linux-riscv64,     os: ubuntu-latest,  target: riscv64gc-unknown-linux-gnu,    tool: cross }
          - { name: linux-ppc64le,     os: ubuntu-latest,  target: powerpc64le-unknown-linux-gnu,  tool: cross }
          - { name: linux-s390x,       os: ubuntu-latest,  target: s390x-unknown-linux-gnu,        tool: cross }
          # BSD and illumos (NetBSD and OpenBSD are built natively in VMs, job `bsd`)
          - { name: freebsd-x86_64,    os: ubuntu-latest,  target: x86_64-unknown-freebsd,         tool: cross }
          - { name: freebsd-i686,      os: ubuntu-latest,  target: i686-unknown-freebsd,           tool: cross, experimental: true }
          - { name: illumos-x86_64,    os: ubuntu-latest,  target: x86_64-unknown-illumos,         tool: cross, experimental: true }
          # macOS, Windows
          - { name: macos-x86_64,      os: macos-latest,   target: x86_64-apple-darwin,            tool: cargo }
          - { name: macos-aarch64,     os: macos-latest,   target: aarch64-apple-darwin,           tool: cargo }
          - { name: windows-x86_64,    os: windows-latest, target: x86_64-pc-windows-msvc,         tool: cargo }
          - { name: windows-i686,      os: windows-latest, target: i686-pc-windows-msvc,           tool: cargo }
          - { name: windows-aarch64,   os: windows-latest, target: aarch64-pc-windows-msvc,        tool: cargo }
          # WebAssembly: runs on any system with a WASI runtime (wasmtime, wasmer, ...)
          - { name: wasm32-wasi,       os: ubuntu-latest,  target: wasm32-wasip1,                  tool: cargo }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install cross
        if: matrix.tool == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: build
        shell: bash
        run: ${{ matrix.tool }} build --release --locked -p kairos --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' kairos/Cargo.toml | head -n 1)
          dir="kairos-${version}-${{ matrix.name }}"
          mkdir -p "$dir/examples" "$dir/docs"
          bin=kairos
          if [[ "${{ matrix.target }}" == *windows* ]]; then bin=kairos.exe; fi
          if [[ "${{ matrix.target }}" == wasm* ]]; then bin=kairos.wasm; fi
          cp "target/${{ matrix.target }}/release/$bin" "$dir/"
          cp LICENSE kairos/README.md "$dir/"
          cp kairos/docs/spec.md "$dir/docs/"
          cp kairos/examples/*.krs "$dir/examples/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "$dir.zip" "$dir" > /dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
          ls -l kairos-*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            kairos-*.tar.gz
            kairos-*.zip

  # NetBSD and OpenBSD: native builds inside a VM (cross images lack parts of their base system)
  bsd:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: netbsd-x86_64,  vm: netbsd }
          - { name: openbsd-x86_64, vm: openbsd }
    steps:
      - uses: actions/checkout@v4
      - name: build in a NetBSD VM
        if: matrix.vm == 'netbsd'
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: /usr/sbin/pkg_add curl
          run: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            cargo build --release --locked -p kairos
            ./target/release/kairos run kairos/examples/finance.krs > /dev/null
            cp target/release/kairos kairos-bin && rm -rf target
      - name: build in an OpenBSD VM
        if: matrix.vm == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: pkg_add rust
          run: |
            cargo build --release --locked -p kairos
            ./target/release/kairos run kairos/examples/finance.krs > /dev/null
            cp target/release/kairos kairos-bin && rm -rf target
      - name: package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' kairos/Cargo.toml | head -n 1)
          dir="kairos-${version}-${{ matrix.name }}"
          mkdir -p "$dir/examples" "$dir/docs"
          cp kairos-bin "$dir/kairos"
          chmod +x "$dir/kairos"
          cp LICENSE kairos/README.md "$dir/"
          cp kairos/docs/spec.md "$dir/docs/"
          cp kairos/examples/*.krs "$dir/examples/"
          tar czf "$dir.tar.gz" "$dir"
          ls -l kairos-*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: kairos-*.tar.gz

  vscode:
    name: build (VS Code extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: package
        working-directory: editors/vscode
        run: |
          version=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce@3 package --out "../../kairos-vscode-${version}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: kairos-vscode-*.vsix

  publish:
    name: publish
    # experimental targets and the BSD VMs never block a release: their packages go in when they
    # build; the step below refuses to publish if any non-experimental package is missing
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.vscode.result == 'success'
    needs: [build, bsd, vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: every required package is there
        run: |
          missing=0
          for n in linux-x86_64 linux-i686 linux-aarch64 linux-armv7 linux-armv6 linux-riscv64 linux-ppc64le linux-s390x \
                   freebsd-x86_64 macos-x86_64 macos-aarch64 windows-x86_64 windows-i686 windows-aarch64 wasm32-wasi; do
            if ! ls dist/kairos-*-"$n".* > /dev/null 2>&1; then echo "missing: $n"; missing=1; fi
          done
          ls -l dist
          exit $missing
      - name: checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          v="${tag#v}"
          # notes = the CHANGELOG.md section "## <version> — <title>"
          awk -v v="$v" '(index($0, "## " v " ") == 1 || $0 == "## " v) { f = 1; next } /^## / && f { exit } f' CHANGELOG.md > notes.md
          title=$(grep -m 1 "^## ${v} " CHANGELOG.md | sed 's/^## [^ ]* *//; s/^— *//')
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --title "Kairós ${tag}${title:+ — $title}" --notes-file notes.md
          fi
