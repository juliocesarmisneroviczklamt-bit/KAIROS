[package]
name = "kairos"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "Kairós: linguagem de programação para pesquisa e IA no mercado financeiro (tipos temporais, holdout linear, diferenciação nativa, eixos nomeados)"

[lib]
name = "kairos"
path = "src/lib.rs"

[[bin]]
name = "kairos"
path = "src/main.rs"

[dependencies]
# ponte com o laboratório: dados da B3, simulador realista, registro de testes
quant-b3 = { path = "..", default-features = false }
# exp, ln e pow em Rust puro: o mesmo programa dá os mesmos bits em qualquer sistema
libm = "0.2"
