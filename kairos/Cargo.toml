[package]
name = "kairos"
version = "0.13.0"
edition = "2024"
license = "MIT"
description = "Kairós: linguagem de programação para pesquisa e IA no mercado financeiro (tipos temporais, holdout linear, diferenciação nativa, eixos nomeados)"

[lib]
name = "kairos"
path = "src/lib.rs"

[[bin]]
name = "kairos"
path = "src/main.rs"

[dependencies]
# ponte com o laboratório: dados da B3, simulador realista, registro de testes
quant-b3 = { path = "..", default-features = false }
# exp, ln e pow em Rust puro: o mesmo programa dá os mesmos bits em qualquer sistema
libm = "0.2"
# the same ZIP reader the lab uses (pure Rust): `read_lines` of a .zip file
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }

# M7: back-end nativo (JIT) onde o Cranelift tem suporte; nas outras plataformas o interpretador
# roda tudo. A mesma condição está em build.rs (cfg `kairos_jit`).
[target.'cfg(any(all(target_arch = "x86_64", any(target_os = "linux", target_os = "macos", target_os = "windows", target_os = "freebsd")), all(target_arch = "aarch64", any(target_os = "linux", target_os = "macos"))))'.dependencies]
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"

# M7: interpreter vs native code vs Rust on the same numeric programs
[[bin]]
name = "kairos-bench"
path = "src/bin/kairos_bench.rs"

[dev-dependencies]
# M13: the tests run the WebAssembly that the compiler written in Kairós generates (an interpreter
# of WebAssembly in pure Rust, so they run on every target)
wasmi = { version = "2", default-features = false, features = ["std", "validate", "portable-dispatch"] }
