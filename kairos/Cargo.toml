[package]
name = "kairos"
version = "0.2.0"
edition = "2024"
description = "Kairós: linguagem de programação para pesquisa e IA no mercado financeiro (tipos temporais, holdout linear, diferenciação nativa, eixos nomeados)"

[lib]
name = "kairos"
